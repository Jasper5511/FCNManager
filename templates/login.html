<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 結構型商品</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; font-family: 'Microsoft JhengHei', sans-serif; }
        .login-card {
            max-width: 380px; margin: 120px auto;
            border: none; box-shadow: 0 4px 20px rgba(0,0,0,.3); border-radius: 12px;
        }
        .login-header { background: #1a1a2e; color: #fff; text-align: center;
            padding: 24px; border-radius: 12px 12px 0 0; }
        .login-header h4 { margin: 0; font-weight: 700; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="login-card card">
        <div class="login-header">
            <h4>結構型商品管理</h4>
        </div>
        <div class="card-body p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
                {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">帳號</label>
                    <input name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">密碼</label>
                    <input name="password" type="password" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100">登入</button>
            </form>
        </div>
    </div>
</body>
</html>
