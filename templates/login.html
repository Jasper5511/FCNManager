<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 結構型商品</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-card card">
        <div class="login-header">
            <div style="font-size:2rem; margin-bottom:0.5rem;">&#128200;</div>
            <h4>結構型商品</h4>
            <p>結構型商品管理系統</p>
        </div>
        <div class="card-body p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }} py-2" style="font-size:0.88rem;">{{ msg }}</div>
                {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">帳號</label>
                    <input name="username" class="form-control" required autofocus placeholder="輸入帳號">
                </div>
                <div class="mb-3">
                    <label class="form-label">密碼</label>
                    <input name="password" type="password" class="form-control" required placeholder="輸入密碼">
                </div>
                <button class="btn btn-primary w-100" style="height:42px; font-weight:600;">登入</button>
            </form>
        </div>
    </div>
</body>
</html>
