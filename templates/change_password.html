{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="page-header" style="justify-content:center;">
            <h5>修改密碼</h5>
        </div>
        <form method="POST" class="card p-4">
            <div class="mb-3">
                <label class="form-label">舊密碼</label>
                <input name="old_password" type="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">新密碼</label>
                <input name="new_password" type="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">確認新密碼</label>
                <input name="confirm_password" type="password" class="form-control" required>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary">更新密碼</button>
                <a href="/" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
