{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h5>新增商品</h5>
</div>
<form method="POST" class="card p-4">
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label">商品代碼</label>
            <input name="product_code" class="form-control" required placeholder="2026SN1072">
        </div>
        <div class="col-md-2">
            <label class="form-label">發行商</label>
            <select name="issuer" class="form-select">
                <option value="">-- 選擇 --</option>
                <option value="MS">MS - 摩根士丹利</option>
                <option value="BNP">BNP - 法國巴黎銀行</option>
                <option value="UBS">UBS - 瑞士銀行</option>
                <option value="SG">SG - 法國興業銀行</option>
                <option value="CITI">CITI - 花旗集團</option>
                <option value="Natixis">Natixis - 法國外貿銀行</option>
                <option value="HSBC">HSBC - 匯豐銀行</option>
                <option value="GS">GS - 高盛國際</option>
                <option value="JPM">JPM - 摩根大通</option>
                <option value="DBS">DBS - 星展銀行</option>
                <option value="Nomura">Nomura - 野村證券</option>
                <option value="Barclays">Barclays - 巴克萊證券</option>
                <option value="BBVA">BBVA - 西班牙對外銀行</option>
                <option value="CA">CA - 東方匯理銀行</option>
            </select>
        </div>
        <div class="col-md-2">
            <label class="form-label">Tenor (月)</label>
            <input name="tenor_months" type="number" class="form-control" placeholder="6">
        </div>
        <div class="col-md-2">
            <label class="form-label">幣別</label>
            <select name="currency" class="form-select">
                <option value="USD" selected>USD</option>
                <option value="AUD">AUD</option>
                <option value="TWD">TWD</option>
                <option value="JPY">JPY</option>
                <option value="CNY">CNY</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">年化利率 (%)</label>
            <input name="coupon_rate" type="number" step="0.01" class="form-control" placeholder="12">
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-3">
            <label class="form-label">交易日</label>
            <input name="trade_date" type="date" class="form-control">
        </div>
        <div class="col-md-3">
            <label class="form-label">比價日 / 發行日</label>
            <input name="start_date" type="date" class="form-control">
        </div>
        <div class="col-md-3">
            <label class="form-label">期末訂價日</label>
            <input name="maturity_date" type="date" class="form-control">
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-3">
            <label class="form-label">KO 類型</label>
            <select name="ko_type" id="ko_type" class="form-select">
                <option value="fixed">FCN（固定 KO）</option>
                <option value="stepdown">Stepdown FCN（遞減 KO）</option>
                <option value="dac">DAC（區間配息）</option>
            </select>
        </div>
        <!-- Fixed FCN: 單一 KO% -->
        <div class="col-md-2" id="fixed_ko_wrap">
            <label class="form-label">KO%</label>
            <input name="ko_pct" type="number" step="0.01" class="form-control" placeholder="100">
        </div>
        <div class="col-md-2">
            <label class="form-label">Strike%</label>
            <input name="strike_pct" type="number" step="0.01" class="form-control" placeholder="70">
        </div>
        <div class="col-md-2">
            <label class="form-label">EKI% (留空=無)</label>
            <input name="eki_pct" type="number" step="0.01" class="form-control" placeholder="60">
        </div>
        <div class="col-md-3">
            <label class="form-label">備注</label>
            <input name="special_notes" class="form-control" placeholder="備注...">
        </div>
    </div>

    <!-- Stepdown FCN 專用欄位 -->
    <div id="stepdown_section" class="row g-3 mt-1" style="display:none;">
        <div class="col-md-2">
            <label class="form-label">起始 KO%</label>
            <input name="ko_start_pct" id="ko_start_pct" type="number" step="0.01" class="form-control" placeholder="98">
        </div>
        <div class="col-md-2">
            <label class="form-label">每月遞減%</label>
            <input name="ko_stepdown_pct" id="ko_stepdown_pct" type="number" step="0.01" class="form-control" placeholder="3">
        </div>
        <div class="col-12 mt-2">
            <strong style="font-size:0.9rem;">每月比價日（請逐月填入實際日期）</strong>
            <div id="obs_dates_container" class="row g-2 mt-1"></div>
            <div id="obs_preview" class="mt-2" style="font-size:0.82rem; color:var(--fcn-text-muted);"></div>
        </div>
    </div>

    <hr>
    <div class="section-title">連結標的</div>
    <div class="row g-3">
        {% for i in range(1, 5) %}
        <div class="col-md-3">
            <label class="form-label">標的 {{ i }}</label>
            <select name="ticker_{{ i }}" class="form-select">
                <option value="">-- 選擇 --</option>
                <optgroup label="半導體">
                    <option value="NVDA">NVDA - 輝達</option>
                    <option value="AVGO">AVGO - 博通</option>
                    <option value="TSM">TSM - 台積電</option>
                    <option value="AMD">AMD - 超微</option>
                    <option value="MU">MU - 美光</option>
                    <option value="ARM">ARM - 安謀</option>
                    <option value="QCOM">QCOM - 高通</option>
                    <option value="INTC">INTC - 英特爾</option>
                </optgroup>
                <optgroup label="科技">
                    <option value="AAPL">AAPL - 蘋果</option>
                    <option value="MSFT">MSFT - 微軟</option>
                    <option value="GOOG">GOOG - Google</option>
                    <option value="AMZN">AMZN - 亞馬遜</option>
                    <option value="META">META - Meta</option>
                    <option value="TSLA">TSLA - 特斯拉</option>
                    <option value="ORCL">ORCL - 甲骨文</option>
                    <option value="CRM">CRM - Salesforce</option>
                    <option value="NFLX">NFLX - Netflix</option>
                    <option value="UBER">UBER - Uber</option>
                </optgroup>
                <optgroup label="能源/航空/其他">
                    <option value="VST">VST - 維斯達公司</option>
                    <option value="UAL">UAL - 聯合航空</option>
                    <option value="PLTR">PLTR - 帕蘭提爾</option>
                    <option value="CRWV">CRWV - CrowdStrike</option>
                    <option value="NEM">NEM - 紐蒙特礦業</option>
                    <option value="BMNR">BMNR - Beamr Imaging</option>
                    <option value="BA">BA - 波音</option>
                    <option value="AAL">AAL - 美國航空</option>
                    <option value="AA">AA - 美國鋁業</option>
                    <option value="NKE">NKE - Nike</option>
                </optgroup>
                <optgroup label="金融/醫療">
                    <option value="UNH">UNH - 聯合健康</option>
                    <option value="JPM">JPM - 摩根大通</option>
                    <option value="GS">GS - 高盛</option>
                    <option value="COIN">COIN - Coinbase</option>
                </optgroup>
            </select>
            <input name="init_price_{{ i }}" type="number" step="0.0001" class="form-control mt-1" placeholder="期初價格">
        </div>
        {% endfor %}
    </div>

    <hr>
    <div class="section-title">客戶部位 (第一筆)</div>
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label">客戶</label>
            <div class="d-flex gap-2">
                <select name="client_id" id="client_select" class="form-select">
                    <option value="">-- 選擇客戶 --</option>
                    {% for c in clients %}
                    <option value="{{ c.id }}">{{ c.name_masked }}</option>
                    {% endfor %}
                </select>
                <button type="button" class="btn btn-outline-success btn-sm" data-bs-toggle="modal" data-bs-target="#newClientModal" style="white-space:nowrap">+ 新增</button>
            </div>
        </div>
        <div class="col-md-3">
            <label class="form-label">投資金額</label>
            <input name="investment_amount" type="number" step="1" class="form-control" placeholder="100000">
        </div>
        <div class="col-md-3">
            <label class="form-label">備注</label>
            <input name="pos_notes" class="form-control">
        </div>
    </div>

    <!-- 新增客戶 Modal -->
    <div class="modal fade" id="newClientModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title" style="font-weight:600;">新增客戶</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input id="new_client_name" class="form-control" placeholder="輸入客戶全名">
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-primary btn-sm" id="save_new_client">新增</button>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">新增商品</button>
        <a href="/" class="btn btn-outline-secondary">取消</a>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script>
// ── Stepdown FCN 動態切換 ──
const koType = document.getElementById('ko_type');
const fixedWrap = document.getElementById('fixed_ko_wrap');
const stepdownSection = document.getElementById('stepdown_section');
const obsContainer = document.getElementById('obs_dates_container');
const obsPreview = document.getElementById('obs_preview');
const tenorInput = document.querySelector('[name=tenor_months]');

function toggleStepdown() {
    const isStepdown = koType.value === 'stepdown';
    fixedWrap.style.display = isStepdown ? 'none' : '';
    stepdownSection.style.display = isStepdown ? '' : 'none';
    if (isStepdown) generateObsFields();
}
koType.addEventListener('change', toggleStepdown);

// Tenor 變動時也重新產生
tenorInput.addEventListener('change', () => {
    if (koType.value === 'stepdown') generateObsFields();
});

// 根據 Tenor 自動產生空白日期欄位
function generateObsFields() {
    const tenor = parseInt(tenorInput.value);
    if (!tenor) { obsContainer.innerHTML = ''; obsPreview.innerHTML = ''; return; }
    // 保留已填的值
    const existing = {};
    document.querySelectorAll('.obs-date-input').forEach(el => {
        const idx = el.name.replace('obs_date_', '');
        if (el.value) existing[idx] = el.value;
    });
    obsContainer.innerHTML = '';
    for (let i = 0; i < tenor; i++) {
        const div = document.createElement('div');
        div.className = 'col-md-2';
        const val = existing[i] || '';
        div.innerHTML = `<label class="form-label" style="font-size:0.8rem;">第 ${i+1} 月</label>
            <input name="obs_date_${i}" type="date" class="form-control form-control-sm obs-date-input" value="${val}">`;
        obsContainer.appendChild(div);
    }
    document.querySelectorAll('.obs-date-input').forEach(el => el.addEventListener('change', updatePreview));
    updatePreview();
}

// 即時預覽 KO 排程
function updatePreview() {
    const startKo = parseFloat(document.getElementById('ko_start_pct').value);
    const stepdown = parseFloat(document.getElementById('ko_stepdown_pct').value);
    const dates = document.querySelectorAll('.obs-date-input');
    if (!startKo || !stepdown || dates.length === 0) { obsPreview.innerHTML = ''; return; }
    let html = '<table class="table table-sm table-bordered" style="font-size:0.8rem; max-width:400px;"><thead><tr><th>月</th><th>比價日</th><th>KO%</th></tr></thead><tbody>';
    dates.forEach((el, i) => {
        const ko = startKo - stepdown * (i + 1);
        const dateVal = el.value ? el.value.substring(5).replace('-', '/') : '未填';
        html += `<tr><td>${i+1}</td><td>${dateVal}</td><td>${ko.toFixed(0)}%</td></tr>`;
    });
    html += '</tbody></table>';
    obsPreview.innerHTML = html;
}
document.getElementById('ko_start_pct').addEventListener('input', updatePreview);
document.getElementById('ko_stepdown_pct').addEventListener('input', updatePreview);

document.getElementById('save_new_client').addEventListener('click', async () => {
    const name = document.getElementById('new_client_name').value.trim();
    if (!name) { FCN.toast('請輸入客戶姓名', 'warning'); return; }
    try {
        const res = await fetch('/api/clients', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name})
        });
        const data = await res.json();
        if (data.id) {
            const sel = document.getElementById('client_select');
            const opt = new Option(data.name, data.id, true, true);
            sel.add(opt);
            document.getElementById('new_client_name').value = '';
            bootstrap.Modal.getInstance(document.getElementById('newClientModal')).hide();
            FCN.toast('客戶新增成功', 'success');
        } else {
            FCN.toast(data.error || '新增失敗', 'error');
        }
    } catch (e) {
        FCN.toast('新增失敗，請重試', 'error');
    }
});
</script>
{% endblock %}
