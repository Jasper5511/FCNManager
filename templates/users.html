{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">使用者管理</h5>
</div>

<div class="row">
    <div class="col-md-7">
        <div class="card p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>帳號</th>
                        <th>角色</th>
                        <th>建立時間</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                {% for u in users %}
                <tr>
                    <td class="fw-bold">{{ u.username }}</td>
                    <td><span class="badge {{ 'bg-danger' if u.is_admin else 'bg-secondary' }}">{{ '管理員' if u.is_admin else '使用者' }}</span></td>
                    <td>{{ u.created_at.strftime('%Y/%m/%d') if u.created_at else '-' }}</td>
                    <td class="text-center">
                        {% if not u.is_admin %}
                        <form action="/users/{{ u.id }}/reset" method="POST" class="d-inline">
                            <input name="new_password" type="text" placeholder="新密碼" class="form-control form-control-sm d-inline" style="width:100px;" required>
                            <button class="btn btn-outline-primary btn-sm">重設密碼</button>
                        </form>
                        <form action="/users/{{ u.id }}/delete" method="POST" class="d-inline ms-1">
                            <button class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('確認刪除 {{ u.username }}？')">刪除</button>
                        </form>
                        {% else %}
                        <span class="text-muted">-</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div class="col-md-5">
        <div class="card p-4">
            <h6 class="fw-bold mb-3">新增使用者</h6>
            <form action="/users/add" method="POST">
                <div class="mb-2">
                    <label class="form-label">帳號</label>
                    <input name="username" class="form-control" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">密碼</label>
                    <input name="password" type="text" class="form-control" required>
                </div>
                <button class="btn btn-primary btn-sm">新增</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
