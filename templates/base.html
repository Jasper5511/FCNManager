<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結構型商品</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #f5f6fa; }
        .navbar { background: #1a1a2e !important; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .badge-active { background: #27ae60; }
        .badge-ko { background: #e67e22; }
        .badge-matured { background: #95a5a6; }
        .ko-hit { color: #e74c3c; font-weight: 700; }
        .ko-miss { color: #bdc3c7; }
        .price-above { color: #e74c3c; font-weight: 700; }
        .price-below { color: #2c3e50; }
        .days-danger { color: #e74c3c; font-weight: 700; }
        .days-warning { color: #e67e22; font-weight: 700; }
        .days-ok { color: #27ae60; }
        .table th { font-size: 0.85rem; white-space: nowrap; }
        .table td { font-size: 0.9rem; vertical-align: middle; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin: 1.5rem 0 0.8rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-3 mb-3">
        <a class="navbar-brand" href="/">結構型商品</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-1">持倉總覽</a>
            <a href="/ko" class="btn btn-outline-warning btn-sm me-1">已出場(KO)</a>
            <a href="/products" class="btn btn-outline-light btn-sm me-1">所有商品</a>
            <a href="/clients" class="btn btn-outline-light btn-sm me-1">客戶</a>
            <a href="/export_excel" class="btn btn-outline-success btn-sm me-1">匯出 Excel</a>
            <a href="/change_password" class="btn btn-outline-light btn-sm me-1">改密碼</a>
            <a href="/logout" class="btn btn-outline-danger btn-sm">登出</a>
        </div>
    </nav>
    <div class="container-fluid px-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
