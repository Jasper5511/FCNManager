{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h5>操作紀錄</h5>
</div>
<div class="card">
    <div class="table-scroll">
    <table class="table table-fcn">
        <thead>
            <tr>
                <th>時間 (UTC)</th>
                <th>帳號</th>
                <th>操作</th>
                <th>IP</th>
            </tr>
        </thead>
        <tbody>
        {% for log in logs %}
        <tr>
            <td class="text-mono" style="font-size:0.82rem;">{{ log.created_at.strftime('%Y/%m/%d %H:%M:%S') }}</td>
            <td class="fw-bold">{{ log.username }}</td>
            <td>{{ log.action }}</td>
            <td><small class="text-muted">{{ log.ip or '-' }}</small></td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    </div>
</div>
{% endblock %}
