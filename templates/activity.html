{% extends 'base.html' %}
{% block content %}
<h5 class="mb-3">操作紀錄</h5>
<div class="card p-0">
    <table class="table table-hover table-sm mb-0">
        <thead class="table-dark">
            <tr>
                <th>時間 (UTC)</th>
                <th>帳號</th>
                <th>操作</th>
                <th>IP</th>
            </tr>
        </thead>
        <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.created_at.strftime('%Y/%m/%d %H:%M:%S') }}</td>
            <td class="fw-bold">{{ log.username }}</td>
            <td>{{ log.action }}</td>
            <td><small class="text-muted">{{ log.ip or '-' }}</small></td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
