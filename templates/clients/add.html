{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="page-header" style="justify-content:center;">
            <h5>新增客戶</h5>
        </div>
        <form method="POST" class="card p-4">
            <div class="mb-3">
                <label class="form-label">客戶姓名</label>
                <input name="name" class="form-control" required placeholder="例：何小名">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">新增</button>
                <a href="/clients" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
